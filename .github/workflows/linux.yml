name: Linux release

# On a linux-X.Y.Z (or linux-X.Y.Z-rc.N) tag, builds the Linux packages (deb,
# rpm, Arch for amd64 and arm64), makes the signed update manifest, and
# attaches everything to a draft GitHub release for the tag. The version
# stamped into the build is the tag without its "linux-" prefix. Windows
# releases are tagged windows-X.Y.Z (windows.yml).
#
# Secrets:
# - UPDATE_SIGNING_KEY: the signify secret key (release.sec) that signs update
#   manifests. Without it the manifest is attached unsigned, to sign by hand
#   with scripts/sign-manifest.sh.
#
# After publishing the release, upload linux-latest.sig to the update server
# as /linux-client/latest.sig (updater/constants_linux.go), then run aur.yml.

on:
  push:
    tags:
      - "linux-[0-9]+.[0-9]+.[0-9]+"
      - "linux-[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (linux-X.Y.Z or linux-X.Y.Z-rc.N)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: linux-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    name: Check version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check the tag is a Linux release version
        id: version
        run: |
          set -eu
          if ! printf '%s' "$TAG" | grep -Eq '^linux-[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "Invalid tag: $TAG (expected linux-X.Y.Z or linux-X.Y.Z-rc.N)" >&2; exit 1
          fi
          echo "version=${TAG#linux-}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Linux: deb, rpm and Arch packages per architecture
  # ---------------------------------------------------------------------------
  linux-package:
    name: Linux package (${{ matrix.arch }})
    needs: check
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Ubuntu 22.04's glibc (2.35) is the oldest the packages need, so they
    # install on Ubuntu 22.04+, Debian 12+, Fedora and Arch.
    container: ubuntu:22.04
    env:
      GOFLAGS: -buildvcs=false
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y -qq build-essential pkg-config git ca-certificates libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build packages
        run: |
          # nfpm needs a newer Go than go.mod pins; let just this install
          # fetch the toolchain it asks for (setup-go sets GOTOOLCHAIN=local).
          GOTOOLCHAIN=auto go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          make package-linux VERSION="$VERSION" LINUX_GOARCH=${{ matrix.arch }} NFPM="$(go env GOPATH)/bin/nfpm"
          ls -la build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            build/pangolin-client-*.deb
            build/pangolin-client-*.rpm
            build/pangolin-client-*.pkg.tar.zst
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Update manifest and the draft release
  # ---------------------------------------------------------------------------
  release:
    name: Draft release
    needs: [check, linux-package]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.check.outputs.version }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          merge-multiple: true
          path: build

      - name: Make the update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -eu
          scripts/generate-linux-manifest.sh
          if [ -n "${UPDATE_SIGNING_KEY}" ]; then
            sudo apt-get install -y -qq signify-openbsd
            key="${RUNNER_TEMP}/release.sec"
            printf '%s\n' "${UPDATE_SIGNING_KEY}" > "$key"
            scripts/sign-manifest.sh "$key" build/linux
            rm -f "$key"
            cp build/linux/latest.sig build/linux-latest.sig
          else
            echo "::warning::UPDATE_SIGNING_KEY is not set; attaching the unsigned manifest"
            cp build/linux/filelist.txt build/linux-filelist.txt
          fi

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          draft: true
          prerelease: ${{ contains(env.TAG, '-rc.') }}
          fail_on_unmatched_files: false
          files: |
            build/pangolin-client-*.deb
            build/pangolin-client-*.rpm
            build/pangolin-client-*.pkg.tar.zst
            build/linux-latest.sig
            build/linux-filelist.txt
