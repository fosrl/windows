name: AUR

# When a release is published, updates the pangolin-client-bin AUR package to
# it. The PKGBUILD comes from packaging/linux/aur/PKGBUILD.in.
#
# Secrets:
# - AUR_SSH_PRIVATE_KEY: SSH key of an AUR account that maintains
#   pangolin-client-bin. Without it the PKGBUILD is only kept as an artifact.

# on:
#   release:
#     types: [published]
#   workflow_dispatch:
#     inputs:
#       tag:
#         description: "Published release to package (X.Y.Z)"
#         required: true
#         type: string

permissions:
  contents: read

jobs:
  aur:
    # The AUR has no prereleases, and pkgver can't contain "-".
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    container: archlinux:latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed base-devel git openssh

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Make the PKGBUILD
        run: |
          set -eu
          case "$TAG" in *-*) echo "Not packaging prerelease $TAG" >&2; exit 1 ;; esac
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          sum() { curl -fsSL "$base/pangolin-client-$1-${TAG}.pkg.tar.zst" | sha256sum | cut -d' ' -f1; }
          amd64=$(sum amd64)
          arm64=$(sum arm64)
          mkdir -p aur-out
          sed -e "s/@VERSION@/${TAG}/" -e "s/@SHA256_AMD64@/${amd64}/" -e "s/@SHA256_ARM64@/${arm64}/" \
            packaging/linux/aur/PKGBUILD.in > aur-out/PKGBUILD
          cp packaging/linux/aur/pangolin-client-bin.install aur-out/
          useradd -m builder
          chown -R builder aur-out
          su builder -c "cd aur-out && makepkg --printsrcinfo > .SRCINFO"
          cat aur-out/PKGBUILD

      - name: Push to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -eu
          if [ -z "${AUR_SSH_PRIVATE_KEY}" ]; then
            echo "::warning::AUR_SSH_PRIVATE_KEY is not set; not pushing"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/pangolin-client-bin.git aur-repo
          cp aur-out/PKGBUILD aur-out/.SRCINFO aur-out/pangolin-client-bin.install aur-repo/
          cd aur-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO pangolin-client-bin.install
          if git diff --cached --quiet; then
            echo "AUR package is already at ${TAG}"
            exit 0
          fi
          git commit -m "Update to ${TAG}"
          git push origin HEAD:master

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aur-pkgbuild
          path: aur-out
          include-hidden-files: true
