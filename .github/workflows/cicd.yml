name: CI/CD

# On a release tag, builds and signs the Windows MSI and the Linux packages
# (deb, rpm, Arch for amd64 and arm64), makes the signed update manifests for
# both, and attaches everything to a draft GitHub release for the tag.
#
# Secrets:
# - UPDATE_SIGNING_KEY: the signify secret key (release.sec) that signs update
#   manifests. Without it the manifests are attached unsigned, to sign by hand
#   with scripts/sign-manifest.sh.
# - Windows code signing (DigiCert KeyLocker / DigiCert ONE, via jsign):
#     SM_API_KEY, SM_CLIENT_CERT_FILE_B64 (base64 of Certificate_pkcs12.p12),
#     SM_CLIENT_CERT_PASSWORD
#   optional repo/org variable SM_KEY_ALIAS: certificate alias or ID
#   (defaults to cert 8657e61d-c2bb-4603-8907-530e879e00bf)
#
# After publishing the release, upload to the update server:
# - windows-latest.sig as /windows-client/latest.sig (updater/constants_windows.go)
# - linux-latest.sig as /linux-client/latest.sig (updater/constants_linux.go)

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (X.Y.Z or X.Y.Z-rc.N)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cicd-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    name: Check version
    runs-on: ubuntu-24.04
    steps:
      - name: Check the tag is a release version
        run: |
          set -eu
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "Invalid tag: $TAG" >&2; exit 1
          fi

  # ---------------------------------------------------------------------------
  # Linux: deb, rpm and Arch packages per architecture
  # ---------------------------------------------------------------------------
  linux-package:
    name: Linux package (${{ matrix.arch }})
    needs: check
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Ubuntu 22.04's glibc (2.35) is the oldest the packages need, so they
    # install on Ubuntu 22.04+, Debian 12+, Fedora and Arch.
    container: ubuntu:22.04
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y -qq build-essential pkg-config git ca-certificates libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build packages
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          make package-linux VERSION="$TAG" LINUX_GOARCH=${{ matrix.arch }} NFPM="$(go env GOPATH)/bin/nfpm"
          ls -la build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            build/pangolin-client-*.deb
            build/pangolin-client-*.rpm
            build/pangolin-client-*.pkg.tar.zst
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows: cross-compile the exe here, sign it and build the MSI on Windows
  # ---------------------------------------------------------------------------
  windows-build:
    name: Windows build
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build Pangolin.exe
        run: |
          make build VERSION="$TAG"
          ls -la build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-unsigned
          path: build/Pangolin.exe
          if-no-files-found: error
          retention-days: 7

  windows-sign:
    name: Sign Windows exe + build/sign MSI
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      EXE: build/Pangolin.exe
      WXS: pangolin.wxs
      PRODUCT_NAME: Pangolin
      PRODUCT_URL: https://pangolin.net
      JSIGN_VERSION: "7.6"
      JSIGN_SHA256: 6cf58aa080e7ff82656f320cff8d4a3bff30408df8766806dcba3740dd839fa5
      WIX_VERSION: "5.0.2"
      WINTUN_VERSION: "0.14.1"
      WINTUN_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51
      WEBVIEW2_BOOTSTRAPPER_URL: https://go.microsoft.com/fwlink/p/?LinkId=2124703
      TSA_URL: http://timestamp.digicert.com
      SM_KEY_ALIAS: ${{ vars.SM_KEY_ALIAS || '8657e61d-c2bb-4603-8907-530e879e00bf' }}  # DigiCert ONE certificate ID (not the keypair alias)
    steps:
      - name: Checkout tagged commit (for pangolin.wxs and icons)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Download unsigned exe
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-unsigned
          path: build

      - name: Install jsign and WiX, fetch Wintun and the WebView2 bootstrapper
        run: |
          $jar = Join-Path $env:RUNNER_TEMP "jsign.jar"
          Invoke-WebRequest -Uri "https://github.com/ebourg/jsign/releases/download/$env:JSIGN_VERSION/jsign-$env:JSIGN_VERSION.jar" -OutFile $jar
          $hash = (Get-FileHash $jar -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:JSIGN_SHA256) { throw "jsign checksum mismatch: $hash" }
          "JSIGN_JAR=$jar" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $zip = Join-Path $env:RUNNER_TEMP "wintun.zip"
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-$env:WINTUN_VERSION.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:WINTUN_SHA256) { throw "wintun checksum mismatch: $hash" }
          $wt = Join-Path $env:RUNNER_TEMP "wintun"
          Expand-Archive -Path $zip -DestinationPath $wt -Force
          Copy-Item (Join-Path $wt "wintun/bin/amd64/wintun.dll") dll/wintun.dll

          # Microsoft updates the Evergreen bootstrapper in place, so there is
          # no fixed hash to pin; check its Microsoft signature instead.
          $wv2 = "dll/MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest -Uri $env:WEBVIEW2_BOOTSTRAPPER_URL -OutFile $wv2
          $sig = Get-AuthenticodeSignature -FilePath $wv2
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw "WebView2 bootstrapper signature check failed: $($sig.Status) $($sig.SignerCertificate.Subject)"
          }

          dotnet tool install --global wix --version $env:WIX_VERSION
          if ($LASTEXITCODE -ne 0) { throw "failed to install wix" }
          $tools = "$env:USERPROFILE\.dotnet\tools"
          $tools | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$tools\wix.exe" extension add -g "WixToolset.Util.wixext/$env:WIX_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "failed to add WixToolset.Util.wixext" }

          java -version

      - name: Write DigiCert client certificate
        env:
          SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
        run: |
          if (-not $env:SM_CLIENT_CERT_FILE_B64) { throw "SM_CLIENT_CERT_FILE_B64 is not set" }
          $p12 = Join-Path $env:RUNNER_TEMP "digicert-client.p12"
          [IO.File]::WriteAllBytes($p12, [Convert]::FromBase64String($env:SM_CLIENT_CERT_FILE_B64))
          "SM_CLIENT_CERT_FILE=$p12" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Sign Pangolin.exe
        env:
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
        run: |
          java -jar $env:JSIGN_JAR --storetype DIGICERTONE `
            --storepass "$env:SM_API_KEY|$env:SM_CLIENT_CERT_FILE|$env:SM_CLIENT_CERT_PASSWORD" `
            --alias $env:SM_KEY_ALIAS --alg SHA-256 --tsaurl $env:TSA_URL `
            --name "$env:PRODUCT_NAME" --url $env:PRODUCT_URL $env:EXE
          if ($LASTEXITCODE -ne 0) { throw "jsign failed for $env:EXE" }

      - name: Build MSI (with signed exe)
        run: |
          # MSI ProductVersion must be numeric (X.Y.Z); drop any -rc.N suffix
          $msiVersion = $env:TAG -replace '-.*$', ''
          $msi = "build/pangolin-amd64-$env:TAG.msi"
          wix build -arch x64 -ext WixToolset.Util.wixext -d "Version=$msiVersion" -d BuildDir=build -d ProjectDir=. -o $msi $env:WXS
          if ($LASTEXITCODE -ne 0) { throw "wix build failed" }
          "MSI=$msi" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Sign MSI
        env:
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
        run: |
          java -jar $env:JSIGN_JAR --storetype DIGICERTONE `
            --storepass "$env:SM_API_KEY|$env:SM_CLIENT_CERT_FILE|$env:SM_CLIENT_CERT_PASSWORD" `
            --alias $env:SM_KEY_ALIAS --alg SHA-256 --tsaurl $env:TSA_URL `
            --name "$env:PRODUCT_NAME" --url $env:PRODUCT_URL $env:MSI
          if ($LASTEXITCODE -ne 0) { throw "jsign failed for $env:MSI" }

      - name: Verify Authenticode signatures
        run: |
          foreach ($f in @($env:EXE, $env:MSI)) {
            $sig = Get-AuthenticodeSignature -FilePath $f
            Write-Host "$f -> $($sig.Status) | signer: $($sig.SignerCertificate.Subject) | timestamp: $($sig.TimeStamperCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "Invalid signature on $f ($($sig.StatusMessage))" }
            if (-not $sig.TimeStamperCertificate) { throw "Missing timestamp on $f" }
          }

      - name: Upload signed MSI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-msi
          path: ${{ env.MSI }}
          if-no-files-found: error

      - name: Remove DigiCert client certificate
        if: ${{ always() }}
        run: |
          if ($env:SM_CLIENT_CERT_FILE) { Remove-Item -Force -ErrorAction SilentlyContinue $env:SM_CLIENT_CERT_FILE }

  # ---------------------------------------------------------------------------
  # Update manifests and the draft release
  # ---------------------------------------------------------------------------
  release:
    name: Draft release
    needs: [linux-package, windows-sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          merge-multiple: true
          path: build

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-msi
          path: build

      - name: Make the update manifests
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -eu
          scripts/generate-manifest.sh "build/pangolin-amd64-${TAG}.msi"
          scripts/generate-linux-manifest.sh
          if [ -n "${UPDATE_SIGNING_KEY}" ]; then
            sudo apt-get install -y -qq signify-openbsd
            key="${RUNNER_TEMP}/release.sec"
            printf '%s\n' "${UPDATE_SIGNING_KEY}" > "$key"
            scripts/sign-manifest.sh "$key" build
            scripts/sign-manifest.sh "$key" build/linux
            rm -f "$key"
            cp build/latest.sig build/windows-latest.sig
            cp build/linux/latest.sig build/linux-latest.sig
          else
            echo "::warning::UPDATE_SIGNING_KEY is not set; attaching the unsigned manifests"
            cp build/filelist.txt build/windows-filelist.txt
            cp build/linux/filelist.txt build/linux-filelist.txt
          fi

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          draft: true
          prerelease: ${{ contains(env.TAG, '-rc.') }}
          fail_on_unmatched_files: false
          files: |
            build/pangolin-amd64-*.msi
            build/pangolin-client-*.deb
            build/pangolin-client-*.rpm
            build/pangolin-client-*.pkg.tar.zst
            build/windows-latest.sig
            build/windows-filelist.txt
            build/linux-latest.sig
            build/linux-filelist.txt
